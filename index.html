
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crimson Flight</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 400px;
    margin: 25px auto;
    padding: 15px;
    background: #130909;
    border: 1px solid #ff3333;
    border-radius: 15px;
}

h1 {
    color: #ff4545;
    letter-spacing: 4px;
}

canvas {
    width: 100%;
    background: #100808;
    border-radius: 10px;
    touch-action: manipulation;
}

button {
    padding: 12px 20px;
    margin: 8px;
    background: #8b1717;
    color: white;
    border: 1px solid red;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #c52b2b;
}

.score {
    font-size: 22px;
    color: #ff4545;
}
</style>
</head>

<body>

<div class="container">
    <h1>CRIMSON FLIGHT</h1>

    <canvas id="game" width="360" height="520"></canvas>

    <p>SCORE: <span id="score" class="score">0</span></p>

    <p id="message">Press START to play!</p>

    <button onclick="startGame()">START GAME</button>
    <button onclick="restartGame()">RESTART</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 360;
const H = 520;

let bird;
let pipes;
let score;
let frame;
let playing = false;
let animationId;

function resetGame() {
    bird = {
        x: 85,
        y: 245,
        velocity: 0,
        radius: 12
    };

    pipes = [];
    score = 0;
    frame = 0;

    document.getElementById("score").textContent = 0;
}

function startGame() {
    cancelAnimationFrame(animationId);

    resetGame();
    playing = true;

    document.getElementById("message").textContent = "";

    gameLoop();
}

function restartGame() {
    startGame();
}

function flap() {
    if (!playing) {
        startGame();
    }

    bird.velocity = -6.1;
}

document.addEventListener("keydown", function(e) {
    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        flap();
    }
});

canvas.addEventListener("pointerdown", function() {
    flap();
});

function createPipe() {
    const gap = 145;
    const top = 65 + Math.random() * 210;

    pipes.push({
        x: W,
        top: top,
        gap: gap,
        passed: false
    });
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);

    gradient.addColorStop(0, "#170909");
    gradient.addColorStop(1, "#080d17");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < 28; i++) {
        const x = (i * 83 + frame * 0.12) % W;
        const y = (i * 67) % H;

        ctx.fillStyle = "rgba(255,100,100,0.35)";
        ctx.fillRect(x, y, 2, 2);
    }
}

function drawPipes() {
    pipes.forEach(pipe => {
        const bottom = pipe.top + pipe.gap;

        ctx.fillStyle = "#7d151e";

        ctx.fillRect(pipe.x, 0, 49, pipe.top);
        ctx.fillRect(pipe.x, bottom, 49, H - bottom);

        ctx.fillStyle = "#fa3d4c";

        ctx.fillRect(pipe.x - 4, pipe.top - 12, 57, 12);
        ctx.fillRect(pipe.x - 4, bottom, 57, 12);
    });
}

function drawBird() {
    ctx.save();

    ctx.translate(bird.x, bird.y);

    ctx.rotate(
        Math.min(0.65, Math.max(-0.55, bird.velocity * 0.065))
    );

    ctx.shadowColor = "#ff3333";
    ctx.shadowBlur = 16;

    ctx.fillStyle = "#ff4545";

    ctx.beginPath();
    ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Bird eye
    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(5, -4, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Pupil
    ctx.fillStyle = "black";

    ctx.beginPath();
    ctx.arc(6, -4, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = "#ffb23e";

    ctx.beginPath();
    ctx.moveTo(9, 1);
    ctx.lineTo(19, 4);
    ctx.lineTo(9, 7);
    ctx.fill();

    ctx.restore();
}

function drawGround() {
    ctx.fillStyle = "#3b1515";
    ctx.fillRect(0, H - 16, W, 16);

    ctx.fillStyle = "#d83434";
    ctx.fillRect(0, H - 16, W, 3);
}

function drawGame() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawPipes();
    drawBird();
    drawGround();
}

function gameOver() {
    playing = false;

    cancelAnimationFrame(animationId);

    document.getElementById("message").textContent =
        "GAME OVER! Your score: " + score;

    drawGame();
}

function gameLoop() {
    if (!playing) return;

    frame++;

    // Bird gravity
    bird.velocity += 0.31;
    bird.y += bird.velocity;

    // Create obstacles
    if (frame % 94 === 1) {
        createPipe();
    }

    pipes.forEach(pipe => {
        pipe.x -= 2.6 + Math.min(score * 0.035, 1.8);

        // Score point
        if (!pipe.passed && pipe.x + 49 < bird.x) {
            pipe.passed = true;
            score++;

            document.getElementById("score").textContent = score;
        }

        // Collision detection
        if (
            bird.x + bird.radius > pipe.x &&
            bird.x - bird.radius < pipe.x + 49 &&
            (
                bird.y - bird.radius < pipe.top ||
                bird.y + bird.radius > pipe.top + pipe.gap
            )
        ) {
            gameOver();
        }
    });

    pipes = pipes.filter(pipe => pipe.x > -60);

    // Ground and ceiling collision
    if (
        bird.y - bird.radius < 0 ||
        bird.y + bird.radius > H - 16
    ) {
        gameOver();
    }

    drawGame();

    if (playing) {
        animationId = requestAnimationFrame(gameLoop);
    }
}

// Initialize game
resetGame();
drawGame();

</script>

</body>
</html>
